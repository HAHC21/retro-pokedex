services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "5110:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5120:5173"
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5130:5174"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7

  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A app.celery_app worker --beat --loglevel=info --concurrency=1
    depends_on:
      - redis
