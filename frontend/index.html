    <script>
      (function () {
        var origin = location.origin;
        var pageUrl = origin + location.pathname;
        var imageUrl = origin + "/apple-touch-icon.png";
        var canonical = document.getElementById("canonical");
        if (canonical) canonical.setAttribute("href", pageUrl);

        function setContent(selector, value) {
          var node = document.querySelector(selector);
          if (node) node.setAttribute("content", value);
        }

        setContent('meta[property="og:url"]', pageUrl);
        setContent('meta[property="og:image"]', imageUrl);
        setContent('meta[name="twitter:image"]', imageUrl);

        var structured = document.getElementById("site-jsonld");
        if (!structured || !structured.textContent) return;
        try {
          var data = JSON.parse(structured.textContent);
          var nodes = data["@graph"] || [];
          nodes.forEach(function (node) {
            node.url = pageUrl;
          });
          structured.textContent = JSON.stringify(data);
        } catch (error) {
          /* Leave the static description in place if the block cannot be parsed. */
        }
      })();
    </script>
